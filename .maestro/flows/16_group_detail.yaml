# Flow 16: Group Detail Screen
# A fresh guest has no groups and no account, so this captures whichever
# no-membership state the session lands on. Group detail tabs need membership.
appId: com.icos.game

---

- launchApp:
    clearState: true
- runFlow: ../subflows/ensure_home.yaml

# Navigate to Groups
- tapOn:
    text: "Groups\nTab 2 of 4"
- waitForAnimationToEnd
- takeScreenshot: 16_group_detail/groups_no_membership

- runFlow:
    when:
      visible:
        text: "(?s).*Account Required.*"
    commands:
      - assertVisible:
          text: "(?s).*Create an account.*"
      - takeScreenshot: 16_group_detail/account_gate_verified

- runFlow:
    when:
      notVisible:
        text: "(?s).*Account Required.*"
    commands:
      - assertVisible: "(?s).*Create Group.*"
      - assertVisible: "Join Group"
      - assertVisible:
          text: "(?s).*Create or join a group.*"
      - takeScreenshot: 16_group_detail/empty_state_verified
