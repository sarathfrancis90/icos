# Flow 07: Groups Screen
# Groups need a real account, so a guest session sees the account gate instead
# of the empty state. Both are valid; this covers whichever one is showing.
appId: com.icos.game

---

- launchApp:
    clearState: true
- runFlow: ../subflows/ensure_home.yaml

# Navigate to Groups tab
- tapOn:
    text: "Groups\nTab 2 of 4"
- waitForAnimationToEnd

- assertVisible: "Groups"
- takeScreenshot: 07_groups/groups_landing

# -- Guest: the account gate --
- runFlow:
    when:
      visible:
        text: "(?s).*Account Required.*"
    commands:
      - assertVisible:
          text: "(?s).*Groups are tied to an account.*"
      - assertVisible:
          text: "(?s).*Create an account.*"
      - takeScreenshot: 07_groups/account_required_gate

# -- Signed in: the empty state and both dialogs --
- runFlow:
    when:
      notVisible:
        text: "(?s).*Account Required.*"
    commands:
      - assertVisible:
          text: "(?s).*Create or join a group.*"
      - assertVisible: "(?s).*Create Group.*"
      - assertVisible: "Join Group"
      - takeScreenshot: 07_groups/groups_empty_state

      - tapOn: "(?s).*Create Group.*"
      - waitForAnimationToEnd
      - takeScreenshot: 07_groups/create_group_dialog
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd

      - tapOn: "Join Group"
      - waitForAnimationToEnd
      - takeScreenshot: 07_groups/join_group_dialog
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: 07_groups/groups_back_to_empty
