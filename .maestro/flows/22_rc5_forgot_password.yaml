# Forgot password: neutral message for a real (EMAIL) and a made-up (FAKE) address. Pass -e EMAIL -e FAKE -e SHOTS.
appId: com.icos.game
---
- launchApp
- runFlow: ../subflows/open_auth_from_profile.yaml
- tapOn: "Sign up with Email"
- tapOn: "Sign In"
- tapOn: "Email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "Forgot password?"
- tapOn: "Send link"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOTS}/e9_forgot_real
- launchApp
- runFlow: ../subflows/open_auth_from_profile.yaml
- tapOn: "Sign up with Email"
- tapOn: "Sign In"
- tapOn: "Email"
- inputText: ${FAKE}
- hideKeyboard
- tapOn: "Forgot password?"
- tapOn: "Send link"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${SHOTS}/e10_forgot_fake
