# Flow 15: Group Create & Join Dialogs
# Group creation needs a real account. A guest gets the account gate instead of
# the dialogs, so this covers whichever path the session is on.
appId: com.icos.game

---

- launchApp:
    clearState: true
- runFlow: ../subflows/ensure_home.yaml

# Navigate to Groups
- tapOn:
    text: "Groups\nTab 2 of 4"
- waitForAnimationToEnd
- takeScreenshot: 15_groups/groups_initial

# -- Guest: creating a group is gated behind signing up --
# Deliberately does not open the signup screen. Both branches below are
# evaluated in order, so navigating away here would make the second one think
# the session is signed in. Signup itself is covered by flow 09.
- runFlow:
    when:
      visible:
        text: "(?s).*Account Required.*"
    commands:
      - assertVisible:
          text: "(?s).*Create an account.*"
      - takeScreenshot: 15_groups/create_gated_behind_account

# -- Signed in: the create and join dialogs --
- runFlow:
    when:
      notVisible:
        text: "(?s).*Account Required.*"
    commands:
      - tapOn: "(?s).*Create Group.*"
      - waitForAnimationToEnd
      - takeScreenshot: 15_groups/create_dialog_empty

      - tapOn:
          text: "(?s).*roup.*ame.*"
          optional: true
      - inputText: "Test Puzzle Squad"
      - takeScreenshot: 15_groups/create_name_entered

      # Dismiss the keyboard before reaching for Cancel.
      - pressKey: enter
      - waitForAnimationToEnd
      - tapOn: "Cancel"
      - waitForAnimationToEnd
      - takeScreenshot: 15_groups/after_create_cancel

      - tapOn:
          text: "Join Group"
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: 15_groups/join_group_result
      - tapOn:
          text: "Cancel"
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: 15_groups/groups_final
