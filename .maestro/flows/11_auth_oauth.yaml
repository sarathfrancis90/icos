# Flow 11: OAuth Buttons Visual Check
# Verifies Google and Apple OAuth buttons render correctly on auth screen.
appId: com.icos.game

---

- launchApp:
    clearState: true
- runFlow: ../subflows/ensure_home.yaml

# Navigate to auth screen via Profile > Create Account
- tapOn:
    text: "Profile\nTab 4 of 4"
- waitForAnimationToEnd
- tapOn: "Create Account"
- waitForAnimationToEnd
- takeScreenshot: 11_oauth/auth_screen_all_buttons

# -- Screenshot each button area --
- takeScreenshot: 11_oauth/oauth_options_full

# -- Tap Google to see what happens (native dialog or error) --
- tapOn:
    text: "(?s).*Google.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11_oauth/after_google_tap

# Dismiss the in-app sign-in sheet/tab. Android: back closes the Custom Tab.
# iOS: the ASWebAuthenticationSession sheet has a Cancel/Close button (Maestro
# `back` is a no-op there).
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "(?i)(cancel|close)"
          optional: true
- waitForAnimationToEnd

# -- Tap Apple to see what happens --
- tapOn:
    text: "(?s).*Apple.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11_oauth/after_apple_tap

# Dismiss (same as above)
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "(?i)(cancel|close)"
          optional: true
- waitForAnimationToEnd
- takeScreenshot: 11_oauth/auth_screen_final
