# Fresh install -> onboarding -> home shows a real server puzzle (not the offline practice notice).
appId: com.icos.game
---
- launchApp:
    clearState: true
- takeScreenshot: ${SHOTS}/a1_onboarding
- tapOn: "Next"
- tapOn: "Next"
- takeScreenshot: ${SHOTS}/a2_onboarding_last
- tapOn:
    text: "Get Started"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Play"
    timeout: 20000
- assertNotVisible: "(?s).*[Oo]ffline puzzle.*"
- takeScreenshot: ${SHOTS}/a3_home
