# Sign in with an existing email account. Pass -e EMAIL -e PW -e SHOTS.
appId: com.icos.game
---
- launchApp
# An earlier flow may have left an email account signed in; sign out first.
- tapOn:
    text: "Profile\nTab 4 of 4"
- runFlow:
    when:
      notVisible: "Create account"
    commands:
      - scrollUntilVisible:
          element: "Sign out"
      - tapOn: "Sign out"
      - tapOn:
          text: "Sign out"
          index: 1
      - waitForAnimationToEnd
      - tapOn:
          text: "Profile\nTab 4 of 4"
- runFlow: ../subflows/open_auth_from_profile.yaml
- tapOn: "Sign up with Email"
- tapOn: "Sign In"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PW}
- takeScreenshot: ${SHOTS}/d6a_signin_filled
# Android exposes the button as plain "Sign In" (the title is "Welcome Back").
- tapOn: "Sign In"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${SHOTS}/d6_after_signin
- tapOn:
    text: "Home\nTab 1 of 4"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/d7_home_after_signin
