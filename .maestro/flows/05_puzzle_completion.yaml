# Flow 05: Puzzle Drawing & Visual States
# Tests path drawing via taps through the grid, showcasing various game states.
appId: com.icos.game

---

- launchApp:
    clearState: true
- runFlow: ../subflows/ensure_home.yaml

# Start puzzle
- tapOn: "Play"
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/puzzle_fresh_start

# -- Draw a path step by step using cell taps --
# Start at waypoint 1
- tapOn:
    text: "(?s).*waypoint 1"
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/started_at_waypoint1

# Draw path upward
- tapOn:
    text: "(?s)Row 5, Column 3.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "(?s)Row 4, Column 3.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/path_going_up

# Draw path right
- tapOn:
    text: "(?s)Row 4, Column 4.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "(?s)Row 4, Column 5.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/path_going_right

# Draw path down toward waypoint 3
- tapOn:
    text: "(?s)Row 5, Column 5.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/reached_waypoint3

# Continue drawing
- tapOn:
    text: "(?s)Row 5, Column 6.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "(?s)Row 5, Column 7.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/path_extended_further

# -- Screenshot the current state for visual audit --
- takeScreenshot: 05_drawing/mid_game_state

# -- Use Undo multiple times --
- tapOn: "Undo"
- waitForAnimationToEnd
- tapOn: "Undo"
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/after_double_undo

# -- Reset --
- tapOn:
    text: "(?s)Reset.*"
- waitForAnimationToEnd
- takeScreenshot: 05_drawing/after_full_reset

- tapOn: "Go back"
- waitForAnimationToEnd
