# Flow 17: Error & Empty States Audit
# Captures all empty/loading states across the app for a fresh user.
appId: com.icos.game

---

- launchApp:
    clearState: true
- runFlow: ../subflows/ensure_home.yaml

# ====== Home - Default state ======
- takeScreenshot: 17_states/home_default

# ====== Stats - Empty state (no puzzles solved) ======
- tapOn:
    text: "Stats\nTab 3 of 4"
- waitForAnimationToEnd
- takeScreenshot: 17_states/stats_zero_everything
- scroll
- takeScreenshot: 17_states/stats_calendar_empty

# ====== Groups - Empty state ======
- tapOn:
    text: "Groups\nTab 2 of 4"
- waitForAnimationToEnd
- takeScreenshot: 17_states/groups_empty

# ====== Profile - Guest state ======
- tapOn:
    text: "Profile\nTab 4 of 4"
- waitForAnimationToEnd
- takeScreenshot: 17_states/profile_guest
- scroll
- takeScreenshot: 17_states/profile_guest_bottom

# ====== Puzzle - Verify it loads without errors ======
- tapOn:
    text: "Home\nTab 1 of 4"
- waitForAnimationToEnd
- tapOn: "Play"
- waitForAnimationToEnd
- takeScreenshot: 17_states/puzzle_loaded_ok

# Verify grid rendered (check for waypoint 1)
- assertVisible:
    text: ".*waypoint 1"
- takeScreenshot: 17_states/puzzle_grid_rendered

- tapOn: "Go back"
- waitForAnimationToEnd
