# Neon dev: signed-in Profile -> Delete Account -> confirm must not show the generic
# error (regression for no-arg RPCs sending a JSON null body). Pass -e SHOTS.
# Manual only (outside config.yaml's flows/*): it requests deletion of the
# signed-in account. Run on its own with a throwaway account:
#   maestro test -e SHOTS=<dir> .maestro/manual/40_neon_account_deletion.yaml
appId: com.icos.game
---
- tapOn:
    text: "Profile\nTab 4 of 4"
- scrollUntilVisible:
    element:
      text: "Delete Account"
- tapOn: "Delete Account"
- tapOn:
    text: "Delete Account"
    index: 1
- takeScreenshot: ${SHOTS}/d1_after_request
- assertNotVisible: "Something went wrong.*"
