name: CI

on:
  pull_request:
  push:
    branches: ['**']

env:
  FLUTTER_VERSION: '3.41.3'

jobs:
  flutter:
    name: Analyze, test, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # pubspec.yaml bundles .env.development and .env.production as assets, so
      # both must exist even for analyze/test. Placeholder values only.
      - name: Create env files from .env.example
        run: |
          cp .env.example .env.development
          cp .env.example .env.production

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (riverpod, freezed, json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - name: Build smoke check (debug APK)
        run: flutter build apk --debug

  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit tests only: the DB-backed suites skip themselves when
      # NEON_TEST_DATABASE_URL is unset, which is intended here (CI has no
      # Neon branch). Run them locally against the `test` branch.
      - name: Test
        run: npm test
